<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Schedule</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="animate__animated animate__fadeIn">
            <h1>Schedule</h1>
        </header>

        <div class="schedule-display animate__animated animate__fadeIn" id="scheduleDisplay">
            <!-- Schedule will be rendered here -->
        </div>
    </div>
    <script>
        fetch('schedule.json')
            .then(response => response.json())
            .then(schedule => {
                const scheduleDisplay = document.getElementById('scheduleDisplay');
                
                Object.entries(schedule).forEach(([weekTitle, days]) => {
                    const weekElement = document.createElement('div');
                    weekElement.className = 'week-container';
                    
                    weekElement.innerHTML = `
                        <h2 class="week-title">${weekTitle}</h2>
                        <div class="days-container">
                            ${Object.entries(days).map(([day, events]) => `
                                <div class="day-item ${events.length ? 'has-events' : 'no-events'} animate__animated animate__fadeInUp">
                                    <h3>${day.split(',')[0]}</h3>
                                    <div class="date-small">${day.split(',')[1]}</div>
                                    ${events.length ? events.map(event => `
                                        <div class="event-card">
                                            <div class="event-time">${event.time}</div>
                                            <div class="event-duration">${event.duration}</div>
                                        </div>
                                    `).join('') : '<div class="no-events-text">No events scheduled</div>'}
                                </div>
                            `).join('')}
                        </div>
                    `;
                    
                    scheduleDisplay.appendChild(weekElement);
                });
            })
            .catch(error => console.error('Error loading schedule:', error));
    </script>
</body>
</html>
